  <!-- Closest shelter posts and cross-members occlude the figure and rear poster. -->
  <path id="front-left-post" fill="rgb(153,178,0)" d="M307 630L337 636L348 671L346 1389L361 1407L359 1441L319 1437L309 1396Z"/>
  <path id="front-left-glass-edge" fill="rgb(150,174,0)" d="M347 674L372 694L373 1327L365 1359L350 1364L353 711Z"/>
