<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1279 1919">
  <title>Station authored inverse-depth intervals</title>
  <desc>Depth metadata only. Red stores each surface's far inverse-depth bound; green stores its near bound. The saved depth is monotonically mapped inside those bounds. Scene order: city, rear poster plane, seated figure, front shelter and glass structure, nearest bin. Original photo pixels are not changed.</desc>
  <!-- An unconstrained interval [0, 1] keeps the saved ground and left building depth. -->
  <rect width="1279" height="1919" fill="rgb(0,255,0)"/>

  <!-- The distant trees, street and city lights, behind the shelter. -->
  <path id="distant-city" fill="rgb(0,45,0)" d="M399 0H1279V986L1068 1000L835 993L831 708L798 645L768 559L609 427L556 373L398 359Z"/>

  <!-- Rear illuminated poster case: one planar object behind the seated figure. -->
  <path id="rear-poster-case" fill="rgb(72,87,0)" d="M397 707L659 685L830 686L843 702L843 1070L798 1072L790 1288L423 1323L397 1299Z"/>

  <!-- Visible seated figure silhouette, traced in bus-stop-person.svg. -->
  <path id="seated-person" fill="rgb(112,130,0)" d="M575 958 C588 947 608 948 624 954 C642 957 654 975 657 990 L655 1007 L646 1019 L638 1026 L636 1038 L630 1046 L619 1047 L611 1040 L607 1031 L596 1027 L582 1014 L568 1010 L535 1008 L513 1019 L495 1041 L485 1063 L476 1082 L469 1107 L460 1133 L454 1164 L451 1197 L448 1221 L446 1234 L473 1234 L497 1215 L513 1199 L535 1195 L560 1200 L578 1222 L604 1242 L631 1262 L648 1263 L650 1282 L656 1308 L655 1339 L661 1368 L675 1378 L718 1380 L735 1371 L736 1362 L726 1353 L714 1345 L709 1336 L711 1324 L724 1320 L734 1304 L733 1283 L735 1264 L732 1244 L728 1227 L721 1209 L713 1189 L705 1171 L693 1157 L676 1148 L649 1141 L589 1140 L588 1129 L607 1120 L629 1112 L648 1102 L653 1094 L651 1087 L645 1081 L639 1078 L628 1082 L615 1088 L604 1095 L592 1099 L580 1096 L583 1080 L586 1060 L595 1050 L598 1040 L588 1024 L575 1014 L565 1008 L565 997 L568 983 L575 975 Z"/>

  <!-- The seat lies at the figure's depth; its front edge is slightly closer. -->
  <path id="seat" fill="rgb(122,141,0)" d="M447 1218L500 1218L495 1268L650 1271L652 1296L431 1294L427 1274L447 1270Z"/>

  <!-- Canopy: the curved solid roof, with the opening beneath it left transparent to depth. -->
  <path id="front-canopy" fill="rgb(150,181,0)" d="M0 405C187 357 352 340 510 366C647 383 761 433 849 502L826 535L793 549L756 566C611 512 420 515 256 544C151 563 64 589 0 613Z"/>
